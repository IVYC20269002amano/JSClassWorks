<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Zero-Trust Shield - セキュリティツール・テンプレート</title>

    <!-- フォント設定 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />

    <!-- CSSの読み込み -->
    <link rel="stylesheet" href="css/reset-min.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/template.css" />
  </head>
  <body>
    <!-- ヘッダー（カードの外に配置） -->
    <header class="page-header">
      <span class="badge" id="labId">SECURITY TOOL</span>
      <h1 id="labTitle">新規テンプレート</h1>
    </header>

    <main class="app-container">
      <!-- 汎用カードUI -->
      <section class="card">
        <p class="section-desc">
          セキュリティツールのプロトタイプ作成用テンプレートです。ここにツールの概要や説明テキストを記述します。
        </p>

        <!-- 入力フィールド例 -->
        <div class="field-group">
          <label for="labInput" class="field-label"
            >サンプル入力フィールド</label
          >
          <input
            type="text"
            id="labInput"
            class="input-field"
            placeholder="検証したいテキストや値を入力..."
            autocomplete="off"
          />
        </div>

        <!-- 実行ボタン例 -->
        <button type="button" id="executeBtn" class="btn btn-primary">
          ⚡ 処理を実行する
        </button>

        <!-- コンソールログ出力エリア -->
        <div class="result-section">
          <h2 class="sub-heading">📡 実行ログコンソール</h2>
          <div class="console-box" id="logConsole"></div>
        </div>
      </section>

      <!-- フッターナビゲーション -->
      <nav class="nav-footer">
        <a href="./index.html" class="nav-link">← トップページへ戻る</a>
      </nav>
    </main>

    <footer>
      <p>
        © 2026 Amano <br />
        このサイトはWeb制作学習の授業課題として制作した非営利のサイトです。
      </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/baffle@0.3.5/dist/baffle.min.js"></script>
    <script src="./js/shuffle.js"></script>

    <!-- テンプレート用スクリプト -->
    <script>
      // どんな検証ページでも、1行で画面の黒コンソールにログを流せる便利オブジェクト
      const LabLogger = {
        consoleEl: document.getElementById("logConsole"),
        log: function (msg, type = "info") {
          const div = document.createElement("div");
          div.className = `log-entry log-${type}`;
          div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
          this.consoleEl.appendChild(div);
          this.consoleEl.scrollTop = this.consoleEl.scrollHeight;
        },
        clear: function () {
          this.consoleEl.innerHTML = "";
        },
      };

      // 動作確認用の初期化
      document.addEventListener("DOMContentLoaded", () => {
        LabLogger.log(
          "ラボ環境（テンプレート）が正常に初期化されました。",
          "success",
        );

        document.getElementById("executeBtn").addEventListener("click", () => {
          const val = document.getElementById("labInput").value;
          LabLogger.log(`ボタンが押されました。入力値: "${val}"`, "info");
        });
      });
    </script>
  </body>
</html>
