<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Zero-Trust Shield - ファイル・シュレッダー</title>

    <!-- フォント設定 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />

    <!-- CSSの読み込み -->
    <link rel="stylesheet" href="css/reset-min.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/shredder.css" />
  </head>
  <body>
    <!-- ヘッダー（カードの外に配置） -->
    <header class="page-header">
      <span class="badge">SECURITY TOOL</span>
      <h1>ファイル・シュレッダー</h1>
    </header>

    <main class="app-container">
      <section class="card">
        <p class="section-desc">
          ファイルを乱数データで上書き破壊します。消去したいファイルを選択し実行後、ダウンロードされたファイルを元の同名ファイルへ上書きしてください。
        </p>

        <!-- ファイル選択エリア -->
        <div class="field-group">
          <label class="file-select-label">
            <input type="file" id="targetFile" class="file-input" />
            <span class="btn-file-select">📁 ファイルを選択</span>
            <span id="fileNameDisplay" class="file-name-display"
              >選択されていません</span
            >
          </label>
        </div>

        <!-- 実行ボタン -->
        <button type="button" id="shredBtn" class="btn btn-primary">
          🗑️ シュレッダー実行
        </button>

        <!-- 通知メッセージエリア -->
        <div id="noticeArea" class="notice-area" aria-live="polite"></div>
      </section>

      <!-- フッターナビゲーション -->
      <nav class="nav-footer">
        <a href="./index.html" class="nav-link">← トップへ戻る</a>
      </nav>
    </main>

    <footer>
      <p>
        © 2026 Amano <br />
        このサイトはWeb制作学習の授業課題として制作した非営利のサイトです。
      </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/baffle@0.3.5/dist/baffle.min.js"></script>
    <script src="./JS/shuffle.js"></script>
    <script src="./JS/shredder.js"></script>
  </body>
</html>
