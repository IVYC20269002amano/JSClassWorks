<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ファイルシュレッダー</title>
    <style>
      #result {
        font-size: 24px;
        font-family: monospace;
      }

      section {
        margin-top: 10px;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>ファイルシュレッダー</h1>
      <p>
        復元出来ないようにファイルを破棄するシュレッダーです。<br />
        消去したいファイルを選択して下さい。<br />
        実行ボタンを押すと自動でダウンロードが開始するので、<br />
        それを元の同名ファイルに上書きして下さい。
      </p>
    </header>
    <main>
      <div id="result">
        <input type="file" name="" id="targetFile" />
        <label for="targetFile">◀ファイルを選択して下さい</label>
      </div>
      <div>
        <button id="shredBtn">シュレッダー実行</button>
      </div>
      <div>
        <p><a href="./index.html">トップへ戻る</a></p>
      </div>
    </main>

    <script src="./JS/shredder.js"></script>
  </body>
</html>
