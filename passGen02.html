<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Zero-Trust Shield - Password Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Limelight&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset-min.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/passGen02.css" />
  </head>
  <body>
    <header class="page-header">
      <span class="badge">SECURITY TOOL</span>
      <h1>パスワード生成器</h1>
    </header>
    <main class="app-container">
      <!-- メインカード -->
      <section class="card">
        <!-- アクションボタン -->
        <button type="button" id="genBtn" class="btn btn-primary">
          32文字生成
        </button>

        <!-- コピーボタン -->
        <button type="button" id="copyBtn" class="btn btn-secondary">
          選択したパスワードをコピー
        </button>

        <!-- 通知エリア -->
        <div id="copyNotice" class="copy-notice" aria-live="polite"></div>

        <!-- パスワード表示コンソール -->
        <div class="result-box">
          <div id="result" class="result-text">ここに生成パスを表示</div>
        </div>

        <!-- カスタマイズコントロール群 -->
        <div class="controls-group">
          <!-- 文字数スライダー -->
          <div class="control-item slider-item">
            <div class="slider-label">
              <span>文字数</span>
              <span id="rangeValue" class="range-value">32</span>
            </div>
            <input
              type="range"
              id="passRange"
              min="4"
              max="64"
              value="32"
              class="range-slider"
            />
          </div>

          <!-- チェックボックス群 -->
          <div class="options-grid">
            <label class="checkbox-label" for="hasUpper">
              <input type="checkbox" id="hasUpper" checked />
              <span class="custom-checkbox"></span>
              <span class="label-text">A~Z の大文字</span>
            </label>

            <label class="checkbox-label" for="hasDigit">
              <input type="checkbox" id="hasDigit" checked />
              <span class="custom-checkbox"></span>
              <span class="label-text">0~9 の数字</span>
            </label>

            <label class="checkbox-label" for="hasSymbol">
              <input type="checkbox" id="hasSymbol" checked />
              <span class="custom-checkbox"></span>
              <span class="label-text">記号 (!@#$)</span>
            </label>
          </div>
        </div>
      </section>

      <!-- ナビゲーション -->
      <nav class="nav-footer">
        <a href="./index.html" class="nav-link">← トップへ戻る</a>
      </nav>
    </main>
    <footer>
      <p>
        © 2026 Amano <br />
        このサイトはWeb制作学習の授業課題として制作した非営利のサイトです。作品に関する著作権・商標権等は各権利者に帰属します。
      </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/baffle@0.3.5/dist/baffle.min.js"></script>
    <script src="./js/shuffle.js"></script>
    <script src="./JS/passGen-ai.js"></script>
  </body>
</html>
