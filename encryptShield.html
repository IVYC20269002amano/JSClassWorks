<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zero-Trust Shield Lab</title>
    <style>
      /* ダークモード UI スキニング */
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --border-color: #30363d;
        --text-color: #c9d1d9;
        --accent-color: #58a6ff;
        --success-color: #238636;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: "Courier New", Courier, monospace;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      main {
        width: 100%;
        max-width: 600px;
      }
      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 20px;
        margin-bottom: 20px;
      }
      h2 {
        margin-top: 0;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
        font-size: 1.2rem;
      }
      textarea {
        width: 100%;
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 10px;
        box-sizing: border-box;
        border-radius: 4px;
        font-family: inherit;
        resize: vertical;
      }
      .btn {
        background-color: var(--success-color);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
        margin-top: 10px;
        width: 100%;
        font-weight: bold;
        font-size: 1.2em;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .console-area {
        background-color: #000;
        border: 1px solid var(--border-color);
        color: #39ff14; /* ターミナルグリーン */
        padding: 15px;
        font-family: monospace;
        min-height: 100px;
        white-space: pre-wrap;
        border-radius: 4px;
      }
      .menu-list {
        list-style: none;
        padding: 0;
      }
      .menu-item {
        margin: 1rem 0;
      }
      .menu-link {
        display: block;
        padding: 1rem;
        background-color: #2a2a2a;
        color: #00ff66;
        text-decoration: none;
        border-radius: 4px;
        border: 1px solid #444;
        transition: background 0.2s;
      }
      .menu-link:hover {
        background-color: #3a3a3a;
      }

      /*このページのみのスタイル*/

      #input-passwd-area[aria-checked="true"] {
        -webkit-text-security: disc;
      }
      #input-passwd-area[aria-checked="false"] {
        -webkit-text-security: none;
      }

      #drop-zone {
        display: flex;
        flex-direction: column;
        margin: 0;
        padding-top: 0;
      }

      #drop-zone p {
        padding: 0 auto 0;
        margin: 10px auto 10px;
      }

      #visible-file {
        display: block;
        width: auto;
        height: 40px;
        border: 1px solid #39ff14;
      }

      #unvisible-file {
        display: block;
        width: auto;
        height: 120px;
        border: 2px dashed #58a6ff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h2>シールド・入力フォーム</h2>

        <!-- 1. 「秘密の合言葉」入力エリア -->
        <label for="input-passwd-area"
          >※必ず元のPassを保存して下さい<br
        /></label>
        <textarea
          name="input-passwd-area"
          id="input-passwd-area"
          rows="3"
          cols="22"
          placeholder="秘密の合言葉を入力して下さい"
          maxlength="64"
          minlength="4"
          required
        ></textarea>
        <label for="toggle-enc-mask">
          <input
            type="checkbox"
            name="toggle-enc-mask"
            id="toggle-enc-mask"
            checked
          />
          表示を隠す
        </label>
        <!-- クリップボードCopyボタンを配置 -->
        <button type="button" id="encrypt-button" class="btn">
          暗号化Start
        </button>
      </div>

      <!-- ログ出力用コンソール -->
      <div class="card">
        <h2>シールド作動ログ</h2>
        <div class="console-area" id="encoded-console"></div>
        <button type="button" id="enc-copy-button" class="btn">
          クリップボードCopy
        </button>
      </div>

      <!-- ファイル暗号化用ドロップエリア -->
      <div class="card">
        <h2>ファイル暗号化フォーム</h2>
        <div id="drop-zone" class="console-area">
          <p>ビューアで見られるファイルをドロップ</p>
          <iframe id="visible-file" class="console-area" src=""> </iframe>
          <p>それ以外のファイルはこちら</p>
          <a id="unvisible-file" href="" download=""></a>
        </div>
      </div>

      <!-- 元のパス出力用  -->
      <div class="card">
        <h2>シールド・解除フォーム</h2>

        <textarea
          name="input-decode-area"
          id="input-decode-area"
          rows="3"
          cols="22"
          placeholder="秘密の暗号キーを入力して下さい"
          maxlength="64"
          minlength="4"
          required
        ></textarea>
        <label for="toggle-dec-mask">
          <input
            type="checkbox"
            name="toggle-dec-mask"
            id="toggle-dec-mask"
            checked
          />
          表示を隠す
        </label>
        <button type="button" id="decode-button" class="btn">
          復号化Start
        </button>
      </div>

      <!-- ログ出力用コンソール -->
      <div class="card">
        <h2>シールド解除ログ</h2>
        <div class="console-area" id="decoded-console"></div>
        <button type="button" id="dec-copy-button" class="btn">
          クリップボードCopy
        </button>
      </div>

      <!-- トップへ戻るリンクボタン -->
      <div>
        <ul class="menu-list">
          <li class="menu-item">
            <a href="./index.html" class="menu-link">トップページへ</a>
          </li>
        </ul>
      </div>
    </main>
    <footer>
      <p>
        このサイトはWeb制作学習の授業課題として制作した非営利のサイトです。作品に関する著作権・商標権等は各権利者に帰属します。
      </p>
    </footer>

    <script src="./JS/encryptShield.js">
      // ─── ここから下は、完全にあなたの独占領域です ───

      // あなたのロジックを、思う存分タイピングしてください！
    </script>
  </body>
</html>
