<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Zero-Trust Shield - 暗号化・復号化ツール</title>

    <!-- フォント設定 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />

    <!-- CSSの読み込み -->
    <link rel="stylesheet" href="css/reset-min.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/encryptShield.css" />
  </head>
  <body>
    <!-- ヘッダー（中央配置） -->
    <header class="page-header">
      <span class="badge">SECURITY TOOL</span>
      <h1>テキスト暗号化・復号化</h1>
    </header>

    <main class="app-container">
      <!-- 1. 暗号化セクション -->
      <section class="card">
        <h2 class="card-title">🔒 シールド・暗号化フォーム</h2>

        <div class="field-group">
          <label for="input-passwd-area" class="field-label">
            ※必ず元の平文テキストを各自で保管してください
          </label>
          <textarea
            name="input-passwd-area"
            id="input-passwd-area"
            rows="3"
            class="textarea-field"
            placeholder="秘密のメッセージやパスワードを入力..."
            maxlength="256"
            minlength="4"
            required
          ></textarea>
        </div>

        <div class="control-row">
          <label class="checkbox-label" for="toggle-enc-mask">
            <input type="checkbox" id="toggle-enc-mask" checked />
            <span class="custom-checkbox"></span>
            <span class="label-text">表示を伏せ字（マスク）にする</span>
          </label>
        </div>

        <button type="button" id="encrypt-button" class="btn btn-primary">
          ⚡ 暗号化 Start
        </button>

        <!-- 暗号化ログ領域 -->
        <div class="result-section">
          <h3 class="sub-heading">📡 暗号化出力ログ</h3>
          <div class="console-box" id="encoded-console"></div>
          <button type="button" id="enc-copy-button" class="btn btn-secondary">
            📋 クリップボードへコピー
          </button>
        </div>
      </section>

      <!-- 2. 復号化セクション -->
      <section class="card">
        <h2 class="card-title">🔓 シールド・復号化フォーム</h2>

        <div class="field-group">
          <label for="input-decode-area" class="field-label">
            復号化したいBase64暗号文字列を入力してください
          </label>
          <textarea
            name="input-decode-area"
            id="input-decode-area"
            rows="3"
            class="textarea-field"
            placeholder="暗号データをここに貼り付け..."
            required
          ></textarea>
        </div>

        <div class="control-row">
          <label class="checkbox-label" for="toggle-dec-mask">
            <input type="checkbox" id="toggle-dec-mask" checked />
            <span class="custom-checkbox"></span>
            <span class="label-text">表示を伏せ字（マスク）にする</span>
          </label>
        </div>

        <button type="button" id="decode-button" class="btn btn-primary">
          🔓 復号化 Start
        </button>

        <!-- 復号化ログ領域 -->
        <div class="result-section">
          <h3 class="sub-heading">📊 復号化結果ログ</h3>
          <div class="console-box" id="decoded-console"></div>
          <button type="button" id="dec-copy-button" class="btn btn-secondary">
            📋 クリップボードへコピー
          </button>
        </div>
      </section>

      <!-- 共通通知エリア -->
      <div id="copyNotice" class="copy-notice" aria-live="polite"></div>

      <!-- ナビゲーション -->
      <nav class="nav-footer">
        <a href="./index.html" class="nav-link">← トップページへ戻る</a>
      </nav>
    </main>

    <footer>
      <p>
        © 2026 Amano <br />
        このサイトはWeb制作学習の授業課題として制作した非営利のサイトです。
      </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/baffle@0.3.5/dist/baffle.min.js"></script>
    <script src="./js/shuffle.js"></script>
    <script src="./JS/encryptShield.js"></script>
  </body>
</html>
